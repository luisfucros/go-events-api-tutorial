services:
  events-api:
    container_name: events-api
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      GIN_MODE: release
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
  migrate:
    image: alpine:3.19
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./cmd/migrate/migrations:/migrations
    entrypoint: >
      sh -c "
      apk add --no-cache curl ca-certificates &&
      curl -L https://github.com/golang-migrate/migrate/releases/latest/download/migrate.linux-amd64.tar.gz | tar xz &&
      mv migrate /usr/local/bin/migrate &&
      migrate -path=/migrations -database 'mysql://root:events_password@tcp(db:3306)/events' -verbose up
      "
  db:
    image: mysql:8.0
    healthcheck:
      test: "exit 0"
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: events_password
      MYSQL_DATABASE: events

  redis:
    image: redis:6.2-alpine
    restart: unless-stopped
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "9090:8080"

volumes:
  db_data:
